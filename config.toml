[ml]
model = "decision_tree"
features = ["tos", "window", "frame_size", "ipi"]

# Optional model parameters
[ml.parameters]



[provision]
links = [
	["s2", "h1"],
	["s2", "h2"],
]

[[provision.nodes]]
name = "s1"
type = "bmv2"
source = "decision_tree"

[[provision.nodes]]
name = "s2"
type = "switch"

[[provision.nodes]]
name = "h1"
type = "docker"
dimage = "client"
ip = "10.0.0.1"

[[provision.nodes]]
name = "h2"
type = "docker"
dimage = "server"
ip = "10.0.0.2"

